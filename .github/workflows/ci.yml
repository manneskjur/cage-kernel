name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: pins
        run: echo "uv=$(cat .uv-version)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ steps.pins.outputs.uv }}
      - run: uv python install
      - name: Run self-test
        run: uv run --script scripts/cage_kernel.py test
      - name: Run lint
        run: uv run --script scripts/cage_kernel.py lint
      - name: Run typecheck
        run: uv run --script scripts/cage_kernel.py typecheck
