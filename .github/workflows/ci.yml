name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Copybara exports the authoritative root pins and this shared action.
      - uses: ./.github/actions/setup-uv
      - name: Run self-test
        run: uv run --script scripts/cage_kernel.py test
      - name: Run lint
        run: uv run --script scripts/cage_kernel.py lint
      - name: Run typecheck
        run: uv run --script scripts/cage_kernel.py typecheck
